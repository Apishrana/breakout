<body>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .harmonica {
            border-radius: 12px;
            padding: 16px;
            background-color: rgb(204, 204, 204);
            color: #444;
        }
        .ttl-row {
            font-weight: bold;
            font-size: 14px;
            margin: 4px 0;
            text-align: center;
        }
        .hole-row {
            padding: 10px;
            display: grid;
            gap: 5px;
            grid-template-columns: repeat(10, 1fr);
        }
        .hole {
            height: 75px;
            width: 75px;
            border: 2px solid #555;
            color: #aaa;
            background-color: #161616;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transform: background 0.05s;
        }
        .hole:hover {
            background: #292929;
        }
        .hole small {
            font-size: 11px;
            margin-top: 5px;
        }
    </style>
    <div class="harmonica">
        <div class="ttl-row">AIR SUCK</div>
        <div class="hole-row" id="suck"></div>
        <div class="ttl-row">AIR BLOW</div>
        <div class="hole-row" id="blow"></div>
    </div>
    <script>
        const AudioContext = window.AudioContext;
        let audio = null;
        let active = null;

        const suckNotes = {
            D4: 293.66,
            G4: 392.0,
            B4: 493.88,
            D5: 587.33,
            F5: 698.46,
            A5: 880.0,
            B5: 987.77,
            D6: 1174.66,
            F6: 1396.91,
            A6: 1760.0,
        };
        const blowNotes = {
            C4: 261.63,
            E4: 329.63,
            G4: 392.0,
            C5: 523.25,
            E5: 659.25,
            G5: 783.99,
            C6: 1046.5,
            E6: 1318.51,
            G6: 1567.98,
            C7: 2093.0,
        };
        function createHoleRow(parent, notes, row) {
            n = 1;
            for (i in notes) {
                const hole = document.createElement('div');
                hole.className = 'hole';
                hole.innerHTML = `<strong>${n}</strong><small>${i}</small>`;
                hole.dataset.frequency = notes[i];
                hole.dataset.name = i;
                hole.dataset.type = row;
                parent.appendChild(hole);
                n++;
            }
        }
        createHoleRow(document.querySelector('#suck'), suckNotes, 'suck');
        createHoleRow(document.querySelector('#blow'), blowNotes, 'blow');
    </script>
</body>
